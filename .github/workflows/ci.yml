name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit + integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/external-integrations/jobops-external-services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/external-integrations/jobops-external-services/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/unit tests/integration

  browser:
    name: Greenhouse browser dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/external-integrations/jobops-external-services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            src/external-integrations/jobops-external-services/requirements.txt
            src/external-integrations/jobops-external-services/requirements-worker.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-worker.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/browser

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web/jobops-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
