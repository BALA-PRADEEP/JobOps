<!doctype html>
<html>
<head><meta charset="utf-8"><title>Greenhouse Fixture</title></head>
<body>
  <main>
    <h1>Software Engineer II</h1>
    <form>
      <label for="first_name">First Name</label>
      <input id="first_name" name="first_name" type="text" required>

      <label for="last_name">Last Name</label>
      <input id="last_name" name="last_name" type="text" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="text" required>

      <label for="linkedin">LinkedIn Profile</label>
      <input id="linkedin" name="linkedin" type="url">

      <label for="portfolio">Portfolio / Website</label>
      <input id="portfolio" name="portfolio" type="url">

      <label for="resume">Resume / CV</label>
      <input id="resume" name="resume" type="file" accept="application/pdf">

      <label for="salary">Expected salary</label>
      <input id="salary" name="salary" type="text">

      <label for="why">Why do you want to work here?</label>
      <textarea id="why" name="why"></textarea>

      <button type="submit">Submit Application</button>
    </form>
  </main>
</body>
</html>
